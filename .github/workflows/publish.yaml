name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: pnpm 🧰
        uses: pnpm/action-setup@v6

      - name: Node 🧰
        # v7 dropped the dummy NODE_AUTH_TOKEN that v6 injects.
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          # No registry-url on purpose: it makes setup-node write an .npmrc
          # holding //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and set
          # NODE_AUTH_TOKEN to a placeholder. npm then believes it is
          # authenticated, never attempts the OIDC exchange, and the publish
          # 404s. The default registry is registry.npmjs.org anyway.
          cache: 'pnpm'

      # npm >= 11.5.1 is required for trusted publishing (OIDC) on npmjs.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install 📦
        run: pnpm install --frozen-lockfile

      - name: Build 🛠
        run: pnpm build

      - name: Uncommitted changes 🔎
        run: git status

      - name: Publish 🚀 PRERELEASE
        if: 'github.event.release.prerelease'
        run: |
          set -euo pipefail
          # pnpm packs, because only it resolves the workspace: protocol into
          # concrete versions. npm publishes, because npmjs trusted publishing
          # expects npm's OIDC implementation -- pnpm's own token exchange 404s
          # here. Dependency order, so a package never precedes what it needs.
          for dir in packages/core-components \
                     packages/react-hooks-components \
                     packages/react-components; do
            out=$(mktemp -d)
            ( cd "$dir" && pnpm pack --pack-destination "$out" )
            npm publish "$out"/*.tgz --tag next --access public
          done

      - name: Publish 🚀 PRODUCTION
        if: '!github.event.release.prerelease'
        run: |
          set -euo pipefail
          # pnpm packs, because only it resolves the workspace: protocol into
          # concrete versions. npm publishes, because npmjs trusted publishing
          # expects npm's OIDC implementation -- pnpm's own token exchange 404s
          # here. Dependency order, so a package never precedes what it needs.
          for dir in packages/core-components \
                     packages/react-hooks-components \
                     packages/react-components; do
            out=$(mktemp -d)
            ( cd "$dir" && pnpm pack --pack-destination "$out" )
            npm publish "$out"/*.tgz --access public
          done

      - name: Post to a Slack channel
        id: slack
        uses: slackapi/slack-github-action@v1.25.0
        with:
          # Slack channel id, channel name, or user id to post message.
          # See also: https://api.slack.com/methods/chat.postMessage#channels
          # channel-id: 'pipeline'
          # For posting a rich message using Block Kit
          payload: |
            {
              "text": "New release ${{github.ref_name}} for ${{github.event.repository.name}}.",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "New release for <${{github.event.repository.html_url}}|`${{github.event.repository.name}}`>\n*<${{github.event.release.html_url}}|release notes>*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project:*\n${{github.event.repository.name}}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{github.ref_name}}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "image",
                      "image_url": "${{github.event.sender.avatar_url}}",
                      "alt_text": "${{github.event.sender.login}}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*${{github.event.sender.login}}* has triggered this release."
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.PIPELINE_SLACK_CHANNEL_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK