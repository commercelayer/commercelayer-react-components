  - '@storybook/addon-docs@10.5.3'
  - '@storybook/addon-links@10.5.3'
  - '@storybook/addon-onboarding@10.5.3'
  - '@storybook/csf-plugin@10.5.3'
  - '@storybook/react-dom-shim@10.5.3'
  - '@storybook/react-vite@10.5.3'
  - '@storybook/react@10.5.3'
  - storybook@10.5.3
  - tsdown@0.22.12
  - verkit@0.1.0
  - brace-expansion@1.1.13 || 1.1.16 || 1.1.17 || 1.1.18 || 5.0.6 || 5.0.7 || 5.0.8 || 5.0.9
  - yaml@2.8.3
  - ip-address@10.1.1 || 10.3.1
  - ws@8.20.1 || 8.21.0
  - form-data@4.0.6
  - tar@7.5.16 || 7.5.17 || 7.5.18 || 7.5.19 || 7.5.21
  - undici@7.28.0 || 7.29.0
